name: Collect GPU availability

on:
  workflow_dispatch:
    inputs:
      discover:
        description: "Also refresh data/vast_gpu_names.json (one extra Vast search)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot Vast + RunPod
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          VAST_DISCOVER: ${{ inputs.discover && '1' || '0' }}
        run: python3 collector/collect.py

      - name: Commit data
        run: |
          git config user.name "gpu-tracker-bot"
          git config user.email "gpu-tracker-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep 5
          done
          exit 1
